<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SuChefi — תפריטים, מתכונים ומעקב תזונה</title>
  <style>
    :root { --bg:#121114; --surface:#1c1a20; --line:#2f2b36; --text:#f5f1ef; --muted:#b5adb0; --peach:#f5b1a5; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.7; padding:32px 18px; }
    main { max-width:740px; margin:0 auto; display:grid; gap:20px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:24px; }
    h1 { margin:0 0 8px; font-size:32px; color:var(--peach); }
    p { margin:0 0 12px; color:var(--text); }
    .muted { color:var(--muted); font-size:15px; }
    .links { display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; }
    a.btn { display:inline-block; padding:12px 20px; border-radius:14px; text-decoration:none; font-weight:700; border:1px solid var(--peach); color:#161418; background:var(--peach); }
    a.btn.sec { background:transparent; color:var(--text); border-color:var(--line); }
    footer { color:var(--muted); font-size:14px; text-align:center; padding-top:8px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>SuChefi</h1>
      <p>אפליקציה בעברית לתכנון תפריטים, מציאת מתכונים לפי יעדים ומה שיש בבית, ומעקב יומי פשוט אחרי תזונה — לשימוש אישי או בליווי מאמן/ת.</p>
      <p class="muted">מיועדת לבני 18 ומעלה · חינמית לשימוש · מופעלת על ידי Sahar Shemesh.</p>
      <div class="links">
        <a class="btn" href="./privacy.html">מדיניות פרטיות</a>
        <a class="btn sec" href="./support.html">תמיכה ויצירת קשר</a>
      </div>
    </section>
    <footer>SuChefi · BY N.K · לפניות: <a href="mailto:sahar15115@gmail.com" style="color:var(--peach);">sahar15115@gmail.com</a></footer>
  </main>
</body>
</html>
